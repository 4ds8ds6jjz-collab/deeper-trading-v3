
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d15">
  <title>Deeper Trading Intelligence V3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080d15;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 18px;
      border-bottom: 1px solid #263244;
    }
    h1 { font-size: 22px; margin: 0; }
    .subtitle { color: #94a3b8; margin-top: 8px; }
    main { padding: 18px; max-width: 900px; margin: auto; }
    .card {
      background: #121b29;
      border: 1px solid #263244;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    select, button {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }
    button { cursor: pointer; }
    .price { font-size: 32px; font-weight: bold; margin: 18px 0; }
    .muted { color: #94a3b8; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Deeper Trading Intelligence</h1>
    <div class="subtitle">V3 · Crypto Market Dashboard</div>
  </header>

  <main>
    <section class="card">
      <h2>Live Market</h2>
      <select id="symbol">
        <option value="BTCUSDT">BTC / USDT</option>
        <option value="ETHUSDT">ETH / USDT</option>
        <option value="PAXGUSDT">PAXG / USDT</option>
      </select>
      <button onclick="loadPrice()">Refresh</button>

      <div id="price" class="price">Loading...</div>
      <div id="status" class="muted">Connecting to market data...</div>
      <div class="row">
        <span>Bid</span>
        <strong id="bid">—</strong>
      </div>
      <div class="row">
        <span>Ask</span>
        <strong id="ask">—</strong>
      </div>
      <div class="row">
  <span>Timeframe</span>
  <select id="timeframe">
    <option value="5m">5 Minutes</option>
    <option value="15m" selected>15 Minutes</option>
    <option value="1h">1 Hour</option>
    <option value="4h">4 Hours</option>
    <option value="1d">1 Day</option>
  </select>
</div>
      <div id="tradingChart" style="width:100%;height:350px;margin:20px 0 12px;border-radius:14px;overflow:hidden;background:#101827;">
  <div id="chartLoading" style="padding:20px;color:#94a3b8;">
    Loading candlestick chart...
  </div>
</div>
    <div class="divider"></div>

  <h2>⚡ AI Trading Analysis</h2>


  <h2 id="tradeDirection">Loading analysis...</h2>

  <div class="row">
    <span>Entry</span>
    <strong id="entry">—</strong>
  </div>

  <div class="row">
    <span>Stop Loss</span>
    <strong id="stopLoss">—</strong>
  </div>

  <div class="row">
    <span>Target 1</span>
    <strong id="target1">—</strong>
  </div>

  <div class="row">
    <span>Target 2</span>
    <strong id="target2">—</strong>
  </div>

  <div class="row">
    <span>Risk / Reward</span>
    <strong id="riskReward">—</strong>
  </div>

  <p id="tradeReason" class="muted"></p>
  <p id="tradeNote" class="muted"></p>

  <button onclick="loadAnalysis()">Refresh Analysis</button>
</section>
  </main>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
  let candleChart;
let candleSeries;

async function loadChart() {
  const symbol = document.getElementById("symbol").value;
  const interval = document.getElementById("timeframe").value;
  const container = document.getElementById("tradingChart");

  try {
    const response = await fetch(
      "/api/candles?symbol=" + encodeURIComponent(symbol) +
      "&interval=" + encodeURIComponent(interval)
    );

    const data = await response.json();

    if (!response.ok || !Array.isArray(data.candles)) {
      throw new Error(data.error || "Candles unavailable");
    }

    const candles = data.candles.map(c => ({
      time: Number(c.time),
      open: Number(c.open),
      high: Number(c.high),
      low: Number(c.low),
      close: Number(c.close)
    })).sort((a, b) => a.time - b.time);

    if (!candles.length) {
      throw new Error("No candle data");
    }

    if (!candleChart) {
      container.innerHTML = "";

      candleChart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 350,
        layout: {
          background: { color: "#101827" },
          textColor: "#94a3b8"
        },
        grid: {
          vertLines: { color: "#1e293b" },
          horzLines: { color: "#1e293b" }
        },
        timeScale: { timeVisible: true }
      });

      candleSeries = candleChart.addCandlestickSeries({
        upColor: "#22c55e",
        downColor: "#ef4444",
        borderVisible: false,
        wickUpColor: "#22c55e",
        wickDownColor: "#ef4444"
      });

      window.addEventListener("resize", () => {
        candleChart.applyOptions({
          width: container.clientWidth
        });
      });
    }

    candleSeries.setData(candles);
    candleChart.timeScale().fitContent();
requestAnimationFrame(() => {
  candleChart.applyOptions({
    width: container.clientWidth,
    height: 350
  });
  
  } catch (error) {
    if (!candleChart) {
      container.textContent = "Chart unavailable: " + error.message;
    }
    console.error("Chart error:", error);
  }
}
    async function loadPrice() {
      const symbol = document.getElementById("symbol").value;
      const priceEl = document.getElementById("price");
      const statusEl = document.getElementById("status");

      try {
        const response = await fetch(
          "/api/price?symbol=" + encodeURIComponent(symbol)
        );
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        const format = value =>
          Number(value).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

        priceEl.textContent = "$" + format(data.price);
        document.getElementById("bid").textContent =
          "$" + format(data.bid);
        document.getElementById("ask").textContent =
          "$" + format(data.ask);
        statusEl.textContent = "Source: Coinbase · " +
          (data.timestamp || "Latest quote");
      } catch (error) {
        priceEl.textContent = "Unavailable";
        statusEl.textContent = error.message;
      }
    }

    document.getElementById("symbol")
      .addEventListener("change", loadPrice);
    async function loadAnalysis() {
      const symbol = document.getElementById("symbol").value;
      const interval = document.getElementById("timeframe").value;

      const directionEl = document.getElementById("tradeDirection");
      directionEl.textContent = "Analyzing market...";
      directionEl.style.color = "#f1f5f9";

      const ids = ["entry", "stopLoss", "target1", "target2", "riskReward"];
      ids.forEach(id => {
        document.getElementById(id).textContent = "—";
      });

      document.getElementById("tradeReason").textContent = "";
      document.getElementById("tradeNote").textContent = "";

      try {
        const response = await fetch(
          "/api/analysis?symbol=" + encodeURIComponent(symbol) +
          "&interval=" + encodeURIComponent(interval)
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Analysis unavailable");
        }

        const format = value =>
          Number.isFinite(Number(value)) && value != null
            ? "$" + Number(value).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              })
            : "—";

        const direction = data.direction || "WAIT";

        directionEl.textContent =
          direction + " · " + (data.status || "Analysis");

        directionEl.style.color =
          direction === "BUY" ? "#4ade80" :
          direction === "SELL" ? "#fb7185" :
          "#facc15";

        document.getElementById("entry").textContent =
          format(data.entry);

        document.getElementById("stopLoss").textContent =
          format(data.stopLoss);

        document.getElementById("target1").textContent =
          format(data.takeProfit1);

        document.getElementById("target2").textContent =
          format(data.takeProfit2);

        document.getElementById("riskReward").textContent =
          data.riskReward || "—";

        document.getElementById("tradeReason").textContent =
          "Reason: " + (data.reason || "Not available");

        document.getElementById("tradeNote").textContent =
          data.note || "Indicative setup only. Not a confirmed trade.";

      } catch (error) {
        directionEl.textContent = "Analysis unavailable";
        document.getElementById("tradeReason").textContent =
          error.message;
      }
    }

    document.getElementById("symbol")
      .addEventListener("change", loadAnalysis);

    document.getElementById("timeframe")
      .addEventListener("change", loadAnalysis);

    loadAnalysis();
    setInterval(loadAnalysis, 30000);
    loadPrice();
    setInterval(loadPrice, 30000);
    document.getElementById("symbol").addEventListener("change", loadChart);
document.getElementById("timeframe").addEventListener("change", loadChart);

loadChart();
setInterval(loadChart, 30000);
  </script>
</body>
</html>
