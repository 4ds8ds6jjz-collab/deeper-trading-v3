
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d15">
  <title>Deeper Trading Intelligence V3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080d15;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 18px;
      border-bottom: 1px solid #263244;
    }
    h1 { font-size: 22px; margin: 0; }
    .subtitle { color: #94a3b8; margin-top: 8px; }
    main { padding: 18px; max-width: 900px; margin: auto; }
    .card {
      background: #121b29;
      border: 1px solid #263244;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    select, button {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }
    button { cursor: pointer; }
    .price { font-size: 32px; font-weight: bold; margin: 18px 0; }
    .muted { color: #94a3b8; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Deeper Trading Intelligence</h1>
    <div class="subtitle">V3 · Crypto Market Dashboard</div>
  </header>

  <main>
    <section class="card">
      <h2>Live Market</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px;">
      <select id="symbol" style="width:130px;max-width:130px;flex-shrink:0;font-size:13px;padding:9px 6px;">
        <option value="BTCUSDT">BTC / USDT</option>
        <option value="ETHUSDT">ETH / USDT</option>
        <option value="PAXGUSDT">PAXG / USDT</option>
      </select>
      
      <select id="timeframe" style="width:86px;max-width:86px;flex-shrink:0;font-size:13px;padding:9px 6px;">
  <option value="5m">5m</option>
  <option value="15m" selected>15m</option>
  <option value="1h">1H</option>
  <option value="4h">4H</option>
  <option value="1d">1D</option>
</select>
</div>

<div id="candleCountdown" style="color:#38bdf8;font-size:14px;font-weight:600;margin:12px 0;text-align:right;">⏳ Candle closes in --:--</div>

      <div id="tradingChart" style="width:100%;height:350px;margin:20px 0 12px;border-radius:14px;overflow:hidden;background:#101827;">
  <div id="chartLoading" style="padding:20px;color:#94a3b8;">
    Loading candlestick chart...
  </div>
</div>
    <div class="divider"></div>

  <h2>⚡ AI Trading Analysis</h2>
<div style="display:flex;gap:10px;margin:18px 0;">
  <button id="bestSetupBtn" type="button"
    style="flex:1;background:#2563eb;color:white;">
    🎯 BEST SETUP
  </button>

  <button id="tradeNowBtn" type="button"
    style="flex:1;background:#334155;color:white;">
    ⚡ TRADE NOW
  </button>
</div>

  <h2 id="tradeDirection">Loading analysis...</h2>

<div id="signalQuality" style="font-size:16px;font-weight:700;color:#fbbf24;margin:12px 0 20px;">
  ⚡ Signal Quality: Loading...
</div>
<div id="breakoutStatus"
     style="font-size:16px;font-weight:bold;color:#facc15;margin:12px 0;">
  ⏳ WAIT FOR BREAKOUT / BREAKDOWN
</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:14px 0 10px;">

  <div style="background:#172235;border:1px solid #26364c;border-radius:9px;padding:10px 3px;text-align:center;min-width:0;">
    <div style="color:#94a3b8;font-size:10px;margin-bottom:6px;">ENTRY</div>
    <strong id="entry" style="color:#60a5fa;font-size:clamp(9px,2.4vw,13px);white-space:nowrap;">—</strong>
  </div>

  <div style="background:#172235;border:1px solid #26364c;border-radius:9px;padding:10px 3px;text-align:center;min-width:0;">
    <div style="color:#94a3b8;font-size:10px;margin-bottom:6px;">SL</div>
    <strong id="stopLoss" style="color:#fb7185;font-size:clamp(9px,2.4vw,13px);white-space:nowrap;">—</strong>
  </div>

  <div style="background:#172235;border:1px solid #26364c;border-radius:9px;padding:10px 3px;text-align:center;min-width:0;">
    <div style="color:#94a3b8;font-size:10px;margin-bottom:6px;">TP1</div>
    <strong id="target1" style="color:#4ade80;font-size:clamp(9px,2.4vw,13px);white-space:nowrap;">—</strong>
  </div>

  <div style="background:#172235;border:1px solid #26364c;border-radius:9px;padding:10px 3px;text-align:center;min-width:0;">
    <div style="color:#94a3b8;font-size:10px;margin-bottom:6px;">TP2</div>
    <strong id="target2" style="color:#4ade80;font-size:clamp(9px,2.4vw,13px);white-space:nowrap;">—</strong>
  </div>

</div>

<div style="display:flex;justify-content:space-between;align-items:center;background:#172235;border:1px solid #26364c;border-radius:9px;padding:12px;margin-bottom:12px;">
  <span style="color:#cbd5e1;font-weight:600;">Risk / Reward</span>
  <strong id="riskReward" style="color:#4ade80;font-size:18px;">—</strong>
</div>


  <p id="tradeReason" class="muted"></p>
  <p id="tradeNote" class="muted"></p>

  <button onclick="loadAnalysis()">Refresh Analysis</button>
</section>
  </main>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
  let candleChart;
let candleSeries;
let tradePriceLines = [];
let analysisMode = "BEST_SETUP";

const bestSetupBtn = document.getElementById("bestSetupBtn");
const tradeNowBtn = document.getElementById("tradeNowBtn");

bestSetupBtn.addEventListener("click", () => {
  analysisMode = "BEST_SETUP";
  bestSetupBtn.style.background = "#2563eb";
  tradeNowBtn.style.background = "#334155";
});

tradeNowBtn.addEventListener("click", () => {
  analysisMode = "TRADE_NOW";
  tradeNowBtn.style.background = "#2563eb";
  bestSetupBtn.style.background = "#334155";
});

function updateCandleCountdown() {
  const timeframe = document.getElementById("timeframe").value;
  const display = document.getElementById("candleCountdown");

  const seconds = {
    "1m": 60,
    "5m": 300,
    "15m": 900,
    "1h": 3600,
    "4h": 14400,
    "1d": 86400
  };

  const duration = seconds[timeframe] || 300;
  const now = Math.floor(Date.now() / 1000);
  const remaining = duration - (now % duration);

  const hours = Math.floor(remaining / 3600);
  const minutes = Math.floor((remaining % 3600) / 60);
  const secs = remaining % 60;

  const pad = n => String(n).padStart(2, "0");

  display.textContent = "⏳ Candle closes in " +
    (hours > 0 ? pad(hours) + ":" : "") +
    pad(minutes) + ":" + pad(secs);
}

updateCandleCountdown();
setInterval(updateCandleCountdown, 1000);

function updateTradeLines(data) {
  if (!candleSeries) return;

  tradePriceLines.forEach(line => {
    candleSeries.removePriceLine(line);
  });
  tradePriceLines = [];

  const levels = [
    { price: data.entry, title: "ENTRY", color: "#38bdf8" },
    { price: data.stopLoss, title: "STOP LOSS", color: "#ef4444" },
    { price: data.takeProfit1, title: "TP1", color: "#22c55e" },
    { price: data.takeProfit2, title: "TP2", color: "#16a34a" }
  ];

  levels.forEach(level => {
    const price = Number(level.price);

    if (Number.isFinite(price) && price > 0) {
      const line = candleSeries.createPriceLine({
        price: price,
        color: level.color,
        lineWidth: 2,
        lineStyle: 2,
        axisLabelVisible: true,
        title: level.title
      });

      tradePriceLines.push(line);
    }
  });
}

async function loadChart() {
  const symbol = document.getElementById("symbol").value;
  const interval = document.getElementById("timeframe").value;
  const container = document.getElementById("tradingChart");
if (candleSeries) {
  tradePriceLines.forEach(line => {
    candleSeries.removePriceLine(line);
  });
  tradePriceLines = [];
}

  try {
    const response = await fetch(
      "/api/candles?symbol=" + encodeURIComponent(symbol) +
      "&interval=" + encodeURIComponent(interval)
    );

    const data = await response.json();

    if (!response.ok || !Array.isArray(data.candles)) {
      throw new Error(data.error || "Candles unavailable");
    }

    const candles = data.candles.map(c => ({
      time: Number(c.time),
      open: Number(c.open),
      high: Number(c.high),
      low: Number(c.low),
      close: Number(c.close)
    })).sort((a, b) => a.time - b.time);

    if (!candles.length) {
      throw new Error("No candle data");
    }

    if (!candleChart) {
      container.innerHTML = "";

      candleChart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 350,
        layout: {
          background: { color: "#101827" },
          textColor: "#94a3b8"
        },
        grid: {
          vertLines: { color: "#1e293b" },
          horzLines: { color: "#1e293b" }
        },
        timeScale: { timeVisible: true }
      });

      candleSeries = candleChart.addCandlestickSeries({
        upColor: "#22c55e",
        downColor: "#ef4444",
        borderVisible: false,
        wickUpColor: "#22c55e",
        wickDownColor: "#ef4444"
      });

      window.addEventListener("resize", () => {
        candleChart.applyOptions({
          width: container.clientWidth
        });
      });
    }

    candleSeries.setData(candles);
    candleChart.timeScale().fitContent();
    loadAnalysis();
requestAnimationFrame(() => {
  candleChart.applyOptions({
    width: container.clientWidth,
    height: 350
  });
});

} catch (error) {
    if (!candleChart) {
      container.textContent = "Chart unavailable: " + error.message;
    }
    console.error("Chart error:", error);
  }
}
    async function loadPrice() {
      const symbol = document.getElementById("symbol").value;
      const priceEl = document.getElementById("price");
      const statusEl = document.getElementById("status");

      try {
        const response = await fetch(
          "/api/price?symbol=" + encodeURIComponent(symbol)
        );
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        const format = value =>
          Number(value).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

        priceEl.textContent = "$" + format(data.price);
        document.getElementById("bid").textContent =
          "$" + format(data.bid);
        document.getElementById("ask").textContent =
          "$" + format(data.ask);
        statusEl.textContent = "Source: Coinbase · " +
          (data.timestamp || "Latest quote");
      } catch (error) {
        priceEl.textContent = "Unavailable";
        statusEl.textContent = error.message;
      }
    }

    document.getElementById("symbol")
      .addEventListener("change", loadPrice);
let analysisMode = "best";

async function loadAnalysis(mode = analysisMode) {
  analysisMode = mode;
      const symbol = document.getElementById("symbol").value;
      const interval = document.getElementById("timeframe").value;

      const directionEl = document.getElementById("tradeDirection");
      directionEl.textContent = "Analyzing market...";
      directionEl.style.color = "#f1f5f9";

      const ids = ["entry", "stopLoss", "target1", "target2", "riskReward"];
      ids.forEach(id => {
        document.getElementById(id).textContent = "—";
      });

      document.getElementById("tradeReason").textContent = "";
      document.getElementById("tradeNote").textContent = "";

      try {
        const response = await fetch(
          "/api/analysis?symbol=" + encodeURIComponent(symbol) +
          "&interval=" + encodeURIComponent(interval) +
"&mode=" + encodeURIComponent(analysisMode)
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Analysis unavailable");
        }

        const format = value =>
          Number.isFinite(Number(value)) && value != null
            ? "$" + Number(value).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              })
            : "—";

        const direction = data.direction || "WAIT";

        directionEl.textContent =
          direction + " · " + (data.status || "Analysis");

        directionEl.style.color =
          direction === "BUY" ? "#4ade80" :
          direction === "SELL" ? "#fb7185" :
          "#facc15";

        document.getElementById("entry").textContent =
          format(data.entry);

        document.getElementById("stopLoss").textContent =
          format(data.stopLoss);

        document.getElementById("target1").textContent =
          format(data.takeProfit1);

        document.getElementById("target2").textContent =
          format(data.takeProfit2);

        document.getElementById("riskReward").textContent =
          data.riskReward || "—";

        document.getElementById("tradeReason").textContent =
          "Reason: " + (data.reason || "Not available");

        document.getElementById("tradeNote").textContent =
          data.note || "Indicative setup only. Not a confirmed trade.";
     const qualityEl = document.getElementById("signalQuality");

if (qualityEl) {
  const quality = data.signalQuality || "UNCONFIRMED";

  qualityEl.textContent = "⚡ Signal Quality: " + quality;

  qualityEl.style.color =
    quality === "STRONG" ? "#4ade80" :
    quality === "OVEREXTENDED" ? "#fb7185" :
    quality === "EARLY" ? "#facc15" :
    "#94a3b8";
}     
const breakoutEl = document.getElementById("breakoutStatus");

if (breakoutEl) {
  const status = data.breakoutStatus || "WAIT FOR BREAKOUT / BREAKDOWN";

  breakoutEl.textContent = "⚡ " + status;

  breakoutEl.style.color =
    status === "BREAKOUT CONFIRMED" ? "#4ade80" :
    status === "BREAKDOWN CONFIRMED" ? "#fb7185" :
    "#facc15";
}
updateTradeLines(data);

      } catch (error) {
        directionEl.textContent = "Analysis unavailable";
        document.getElementById("tradeReason").textContent =
          error.message;
      }
    }

    document.getElementById("symbol")
      .addEventListener("change", loadAnalysis);

    document.getElementById("timeframe")
      .addEventListener("change", loadAnalysis);
document.getElementById("bestSetupBtn").onclick = () => {
  loadAnalysis("best");
};

document.getElementById("tradeNowBtn").onclick = () => {
  loadAnalysis("now");
};
    loadAnalysis();
    setInterval(loadAnalysis, 30000);
    
    document.getElementById("symbol").addEventListener("change", loadChart);
document.getElementById("timeframe").addEventListener("change", loadChart);

loadChart();
setInterval(loadChart, 30000);
  </script>
</body>
</html>
